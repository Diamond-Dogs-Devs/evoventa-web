<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión | Evoventa</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #3a5aff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .card {
        width: min(90vw, 440px);
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.4);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        display: grid;
        place-items: center;
        font-size: 2rem;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.7rem, 4vw, 2.5rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="icon" aria-hidden="true">📶</div>
      <h1>Sin conexión</h1>
      <p>
        Estás fuera de línea y esta vista no está disponible en este momento. La
        aplicación conservará el contenido que ya fue cargado previamente.
      </p>
    </main>
  </body>
</html>
